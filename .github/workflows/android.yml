name: Build and test Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install SDK platform
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - name: Compile APK and run finance/parser unit tests
        run: gradle --no-daemon testDebugUnitTest assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Sarfa-Android-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: ignore
      - name: Enable KVM acceleration for Android emulator
        run: |
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
          fi
      - name: Emulator integration tests (confirmation, CRUD, real PDF render)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            gradle --no-daemon connectedDebugAndroidTest --stacktrace
            adb shell run-as com.sarfa.voice cat files/test-report.pdf > sarfa-tested-report.pdf
            adb shell run-as com.sarfa.voice cat files/test-multipage-report.pdf > sarfa-tested-multipage-report.pdf
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Sarfa-Tested-PDFs
          path: sarfa-tested-*.pdf
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Sarfa-Test-Results
          path: |
            app/build/reports/tests/
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          if-no-files-found: ignore
